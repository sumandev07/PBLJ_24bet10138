spring.application.name=student-management-api
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/student_management}
spring.datasource.username=${DB_USERNAME:student_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false
